---
name: |-
  Todos collection

url: |-
  /api/todos/

services:
- method: |-
    GET

  description: |-
    Returns the collection of current todos

  input_schema: |-
    {
    }

  # This service negotiates its representation on Accept. Since webspicy
  # 0.27, the output schema is also checked against unstructured bodies,
  # so the csv representation must be covered here as well.
  output_schema: |-
    [Todo]|Csv

  error_schema: |-
    ErrorSchema

  examples:

    - description: |-
        when requested
      params: {}
      expected:
        content_type: application/json
        status: 200
      assert:
        - size(1)

    - description: |-
        when requested in csv format
      tags:
        - csv
      headers:
        Accept: text/csv
      params: {}
      expected:
        content_type: text/csv
        status: 200
      assert:
        - match(/1,Write more code/)
